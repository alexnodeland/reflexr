[project]
name = "reflexr"
version = "0.1.0.dev0"
description = "Rules over event streams that run LLM workflows: pydantic-ai agents, pydantic-graph graphs and functions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Nodeland", email = "alex@ournature.studio" }]
requires-python = ">=3.12"
keywords = ["agents", "llm", "events", "rules", "workflows", "pydantic-ai", "pydantic-graph", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "cronsim>=2.7",
    "opentelemetry-api>=1.45",
    "pydantic>=2.13",
    "pydantic-ai-slim>=2.51",
    "pydantic-graph>=2.51",
]

[project.optional-dependencies]
sql = ["sqlalchemy[asyncio]>=2.1", "alembic>=1.20"]
sqlite = ["reflexr[sql]", "aiosqlite>=0.22"]
postgres = ["reflexr[sql]", "asyncpg>=0.31"]
fastapi = ["fastapi>=0.141"]
mcp = ["mcp>=2.2"]
evals = ["evalr>=0.1.0.dev0"]
# The score mapping and ports that reflexr.scores' mirror and the adapter build on.
langfuse = ["langfuse>=4.15,<5", "evalr>=0.1.0.dev0"]
litellm = ["pydantic-ai-slim[openai]>=2.51"]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-asyncpg>=0.66b0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-instrumentation-logging>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-processor-baggage>=0.66b0",
    "opentelemetry-sdk>=1.45",
]

[project.urls]
Homepage = "https://reflexr.alexnodeland.com"
Documentation = "https://reflexr.alexnodeland.com"
Repository = "https://github.com/alexnodeland/reflexr"
Issues = "https://github.com/alexnodeland/reflexr/issues"
Changelog = "https://github.com/alexnodeland/reflexr/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "hypothesis>=6.168",
    "aiosqlite>=0.22",
    "asyncpg>=0.31",
    "opentelemetry-sdk>=1.45",
    "httpx>=0.28",
    "fastapi>=0.141",
    "mcp>=2.2",
    "evalr>=0.1.0.dev0",
]
lint = ["ruff>=0.16", "pyright>=1.1.414"]
docs = [
    "zensical>=0.0.66",
    "mkdocstrings-python>=2.0.9",
    "griffe-pydantic>=1.3.1",
    "mdx-truly-sane-lists>=1.3",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    "pre-commit>=4.6",
    "git-cliff>=2.14",
]

# evalr is not published yet: the [evals] and [langfuse] extras resolve it from GitHub, pinned
# (ADR-0020, ADR-0025).
[tool.uv.sources]
evalr = { git = "https://github.com/alexnodeland/evalr", rev = "c6866c4b3f338f4dbace7b625765105e4a0dc7a1" }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# The reference implementation is a workspace member, built on the public API only.
[tool.uv.workspace]
members = ["examples/oncall"]

# ─── lint and format ──────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples/oncall/src"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "RUF", "C4", "PIE", "RET",
    "PT", "ASYNC", "PERF", "ARG", "T20", "ERA",
]
ignore = [
    "D105", # magic methods document themselves
    "D107", # __init__ is documented on the class
    "N818", # exceptions are named for what happened (NotFound), not with an Error suffix
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# reflexr.fastapi, reflexr.mcp and reflexr.langfuse share their names with the libraries they adapt; without
# this, isort's same-package detection files the libraries as first-party.
known-third-party = ["fastapi", "mcp", "evalr", "langfuse"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ARG"]
"examples/*/tests/**" = ["D", "ARG"]
# pydantic-ai hides a tool's RunContext from the model, so tool docstrings don't document it.
"src/reflexr/agent/tools.py" = ["D417"]

# ─── types ────────────────────────────────────────────────────────────────────

[tool.pyright]
include = ["src", "tests", "examples", "scripts"]
strict = ["src", "examples/oncall/src", "scripts"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

# ─── tests and coverage ───────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests", "examples/oncall/tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # backoff, which Langfuse uses, calls asyncio.iscoroutinefunction, deprecated in Python 3.14.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff._decorator",
]
markers = [
    "postgres: needs a PostgreSQL database (set REFLEXR_TEST_POSTGRES_URL)",
]

[tool.coverage.run]
branch = true
# By path, not package name, so that modules loaded under other names (such as Alembic
# migrations) are still measured.
source = ["src/reflexr", "examples/oncall/src/oncall"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "assert_never\\(",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "class .*\\(Protocol.*\\):",
]
