# The documentation site, built with Zensical (ADR-0032). `make docs` builds it in strict mode;
# `make docs-serve` serves it with live reload.

site_name: reflexr
site_description: >-
  Rules over event streams that run LLM workflows: pydantic-ai agents, pydantic-graph graphs and
  functions.
site_author: Alex Nodeland
site_url: https://reflexr.alexnodeland.com/
repo_url: https://github.com/alexnodeland/reflexr
repo_name: alexnodeland/reflexr
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Alex Nodeland. Released under the MIT License.
docs_dir: docs

theme:
  name: material
  variant: modern
  language: en
  logo: assets/brand/mark-light.svg
  favicon: assets/brand/favicon.svg
  font:
    text: Schibsted Grotesk
    code: Fragment Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Use the light scheme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Use the dark scheme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Follow the system scheme
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow

extra_css:
  - assets/stylesheets/brand.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  # Nested lists are indented by two spaces, as GitHub renders them; Python-Markdown needs four
  # without this.
  - mdx_truly_sane_lists:
      nested_indent: 2
      truly_sane: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Pages under docs/project/ include the repository's root files (CONTRIBUTING.md and
      # others) instead of copying them.
      base_path: [.]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://docs.pydantic.dev/latest/objects.inv
            - https://ai.pydantic.dev/objects.inv
            - https://evalr.alexnodeland.com/objects.inv
          options:
            docstring_style: google
            extensions:
              - griffe_pydantic:
                  schema: false
              - scripts/griffe_sphinx_roles.py:SphinxRoles
            filters: ["!^_", "!^model_config$"]
            heading_level: 3
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

