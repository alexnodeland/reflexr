# Builds the documentation site with `make docs` on every pull request, and publishes it to
# GitHub Pages at https://reflexr.alexnodeland.com (ADR-0032, ADR-0033, ADR-0046) from
# main: on every push, so the site always shows main's documentation, and by hand. The custom
# domain is set in the repository's Pages settings, with "GitHub Actions" as the source.

name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runs on main wait their turn, so an older commit never deploys after a newer one; a newer run
# on a pull request cancels the older one.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # make docs runs git-cliff, which reads the whole history
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --all-groups --all-packages
      - run: make docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
