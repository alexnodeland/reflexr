# Builds the documentation site and publishes it to GitHub Pages at
# https://reflexr.alexnodeland.com (ADR-0032, ADR-0033): on every push to main, so the site
# always shows main's documentation, and by hand. The custom domain is set in the repository's
# Pages settings, with "GitHub Actions" as the source.

name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # git-cliff reads the whole history
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --all-groups --all-packages
      - run: uv run git-cliff --output CHANGELOG.md  # the site shows main's changelog
      - run: uv run zensical build --strict --clean
      - run: uv run python scripts/check_site.py site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
