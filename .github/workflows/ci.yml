name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --all-groups --all-packages
      - run: uv run ruff format --check .
      - run: uv run ruff check --output-format=github .
      - run: uv run pyright

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras --all-groups --all-packages
      - run: uv run pytest --cov --cov-report=term-missing

  postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: reflexr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      REFLEXR_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:reflexr@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --all-extras --all-groups --all-packages
      - run: uv run pytest --cov --cov-report=term-missing

  compose:
    name: Compose and dashboards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Validates the Compose files without starting containers (ADR-0021, ADR-0037).
      - name: The contributor stack
        run: |
          docker compose config -q
          docker compose --profile app config -q
          docker compose -f compose.yaml -f compose.stackr.yaml --profile app config -q
      - name: The dev container, without and with stackr's network
        run: |
          files="-f compose.yaml -f .devcontainer/compose.yaml -f .devcontainer/stackr.generated.yaml"
          bash .devcontainer/initialize.sh
          docker compose $files config -q
          docker network create stackr
          bash .devcontainer/initialize.sh
          docker compose $files config -q
      # The dashboards' queries are tested against the metric registry in tests/test_dashboards.py.
      - name: The dashboards' JSON
        run: for file in deploy/grafana/dashboards/*.json; do jq empty "$file"; done

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # git-cliff reads the whole history
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --all-groups --all-packages
      - run: uv run git-cliff --output CHANGELOG.md  # the site shows main's changelog
      - run: uv run zensical build --strict --clean
      - run: uv run python scripts/check_site.py site
