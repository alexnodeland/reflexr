version: 2
updates:
  - package-ecosystem: uv
    directory: /
    # A library's pyproject.toml states the oldest versions it supports; only the lockfile
    # (what CI and contributors run) follows the latest releases.
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
